name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper-test:
    name: helper tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - run: go build ./...
      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then go test ./...; else go test -race ./...; fi

  helper-lint:
    name: helper lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - run: go vet ./...
      - run: go tool staticcheck ./...

  firmware:
    name: firmware tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: unit and contract tests (host, AddressSanitizer and UBSan)
        run: pio test -e native
      - name: build e32r40t
        run: pio run -e e32r40t
      - uses: actions/upload-artifact@v6
        with:
          name: firmware-e32r40t
          path: |
            firmware/.pio/build/e32r40t/managents-firmware-e32r40t.bin
            firmware/.pio/build/e32r40t/managents-firmware-e32r40t.version
      - name: render screens (fails if strips and a full-frame paint differ)
        working-directory: .
        run: make screens
      - name: docs/screens is up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- docs/screens)" ]; then
            git status --short -- docs/screens
            echo "::error::The rendered screens changed: run 'make screens' and commit docs/screens"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: screens
          path: docs/screens/*.png

  firmware-format:
    name: firmware format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==23.1.3
      - run: make format-check

  enclosure:
    name: enclosure renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad
      - run: make enclosure enclosure-check
      - uses: actions/upload-artifact@v6
        with:
          name: enclosure-stl
          path: enclosure/stl/*.stl
